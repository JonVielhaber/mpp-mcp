version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 10
      semver-patch-days: 5
      semver-minor-days: 10
      semver-major-days: 15
    labels:
      - "dependencies"

